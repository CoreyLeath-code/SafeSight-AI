name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish v0.1.0 release and GHCR package
    if: startsWith(github.event.head_commit.message, 'release-v0.1.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify release boundary
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v0.1.0" >/dev/null; then
            echo "v0.1.0 already exists; refusing to overwrite an immutable release boundary."
            exit 1
          fi
          grep -q '^version = "0.1.0"' pyproject.toml

      - name: Install release toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Re-run release gates
        run: |
          python -m compileall -q safesight src api app tests
          ruff check safesight tests/test_release_*.py src/detector.py api/main.py app/app/app/core/risk_engine.py
          python -m pytest tests -v \
            --cov=safesight \
            --cov-report=term-missing \
            --cov-fail-under=85
          python -m build
          python -m safesight.benchmark \
            --seed 20260828 \
            --samples 10000 \
            --iterations 50 \
            --warmups 5 \
            --output benchmark-results.json

      - name: Generate source archive and checksums
        run: |
          git archive --format=tar.gz --prefix=safesight-ai-0.1.0/ \
            -o safesight-ai-0.1.0-source.tar.gz HEAD
          sha256sum dist/* benchmark-results.json safesight-ai-0.1.0-source.tar.gz > SHA256SUMS

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/coreyleath-code/safesight-ai:0.1.0
            ghcr.io/coreyleath-code/safesight-ai:latest

      - name: Smoke-test published container
        run: |
          docker pull ghcr.io/coreyleath-code/safesight-ai:0.1.0
          docker run -d --name safesight-release -p 8000:8000 ghcr.io/coreyleath-code/safesight-ai:0.1.0
          trap 'docker logs safesight-release; docker rm -f safesight-release' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"version":"0.1.0"' /tmp/health.json
          code=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:8000/ready)
          test "$code" = "503"
          grep -q 'verified_model_unavailable' /tmp/ready.json

      - name: Create immutable tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.0 -m "SafeSight AI v0.1.0"
          git push origin v0.1.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.0 \
            dist/* \
            benchmark-results.json \
            safesight-ai-0.1.0-source.tar.gz \
            SHA256SUMS \
            sbom.cdx.json \
            --title "SafeSight AI v0.1.0" \
            --notes-file RELEASE_NOTES_v0.1.0.md
