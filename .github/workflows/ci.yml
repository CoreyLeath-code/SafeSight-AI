name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile and lint
        run: |
          python -m compileall -q safesight src api app tests
          ruff check safesight tests/test_release_*.py src/detector.py api/main.py app/app/app/core/risk_engine.py
      - name: Test with fail-closed coverage gate
        run: |
          python -m pytest tests -v \
            --cov=safesight \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

  package:
    name: Package, benchmark, and container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build Python distributions
        run: python -m build
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/safesight-wheel
          /tmp/safesight-wheel/bin/python -m pip install dist/*.whl
          /tmp/safesight-wheel/bin/python -c "import safesight; assert safesight.__version__ == '0.1.0'"
      - name: Generate deterministic benchmark evidence
        run: |
          python -m safesight.benchmark \
            --seed 20260828 \
            --samples 10000 \
            --iterations 50 \
            --warmups 5 \
            --output benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: safesight-benchmark
          path: benchmark-results.json
          if-no-files-found: error
      - name: Build container
        run: docker build -t safesight-ai:ci .
      - name: Smoke-test liveness and fail-closed readiness
        run: |
          docker run -d --name safesight-ci -p 8000:8000 safesight-ai:ci
          trap 'docker logs safesight-ci; docker rm -f safesight-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health.json
          code=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:8000/ready)
          test "$code" = "503"
          grep -q 'verified_model_unavailable' /tmp/ready.json
