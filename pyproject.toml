[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safesight-ai"
version = "0.1.0"
description = "Evidence-bounded safety-policy and image-validation API reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Corey Leath"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.22,<1",
  "pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
safesight-benchmark = "safesight.benchmark:main"

[tool.setuptools.packages.find]
include = ["safesight*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
